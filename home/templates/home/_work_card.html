{% load gate %}
{# 成果物のカード。成果物一覧と TOP で共用する。 #}
<div class="card work-card">
    <div class="work-type">{{ work.category }}</div>
    <h2>{{ work.title }}</h2>
    <p class="work-desc">{{ work.description|linebreaksbr }}</p>
    <div class="work-foot">
        {% if work.license %}
        <span class="badge badge-ink">{{ work.license }}</span>
        {% else %}
        <span></span>
        {% endif %}
        {# どれも別タブで開く。URL が未設定なら「作成中」ページ（閉じるボタンで元のページに戻る）。 #}
        <a class="work-link" href="{% if work.url %}{{ work.url|gate_link }}{% else %}{% url 'home:coming_soon' %}?from=works{% endif %}" target="_blank" rel="noopener noreferrer" aria-label="詳細を見る（別タブで開きます）"><i class="fas fa-arrow-right"></i></a>
    </div>
</div>
