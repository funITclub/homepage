# デプロイのときに取り込む WG のアプリ（.github/workflows/deploy.yml）。
#
# WG のソースはこのリポジトリに入れない（WG のリポジトリは非公開のまま）。
# ここに書いたものを、デプロイの直前だけ <as>/<アプリ名>/ に置いて App Service に載せる。
#
#   repo   取り込む WG のリポジトリ（funITclub/ 配下）
#   take   そのリポジトリの中の、取り込むアプリのフォルダー名（複数書ける）
#   as     置き場所。作っている途中は wg、公表したら works に変える（URL は変わらない）
#
# アプリのフォルダー名がそのまま URL になる（protein → /protein/）。
# 1つのリポジトリに複数のアプリがあるときは take に並べる。並べなかったものは
# 本番に載らないので、載せるアプリから載せないアプリへリンクしないこと。
#
# URL を入れ子にしたいときは、文字列のかわりに {app, url} と書く。
#       take:
#         - welfare                            → /welfare/
#         - {app: welfare_tracker, url: welfare/tracker}   → /welfare/tracker/
# 上の段（/welfare/）の通行証で、下の段（/welfare/tracker/）も開ける。
# フォルダー名は Django のアプリ名になるので、ほかの WG と重ならない名前にすること
# （wg-protein にも tracker があるなら、welfare 側は welfare_tracker のようにする）。
#
# WG が終わったら、ここから消す。次のデプロイで本番から外れる
# （DB のテーブルは残るので、消すときは別途）。

apps:
  # 機能性タンパク質設計サジェストAI研究 WG
  - repo: funITclub/wg-protein
    take:
      - protein                                          # /protein/        検討中の資料
      - {app: protein_tracker, url: protein/tracker}     # /protein/tracker/ チケット管理
    as: wg

  # 福祉 WG
  - repo: funITclub/wg-welfare
    take:
      - welfare                                          # /welfare/        構想の資料
      - {app: welfare_tracker, url: welfare/tracker}     # /welfare/tracker/ チケット管理
    as: wg
