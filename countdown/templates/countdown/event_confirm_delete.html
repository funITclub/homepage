{% extends "countdown/base_app.html" %}

{% block title %}削除 — カウントアップ＆ダウン{% endblock %}

{% block contents %}
<div class="container">
    <section class="editor editor-narrow">

        <div class="section-head">
            <p class="section-label">// 削除</p>
            <a class="section-more" href="{% url 'countdown:event_list' %}">← 一覧に戻る</a>
        </div>

        <div class="card">
            <p class="editor-confirm">次の登録を削除します。元に戻せません。</p>
            <p class="editor-target">
                <span class="editor-date">{{ object.date|date:"Y-m-d" }}</span>
                {{ object.name }}
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="form-actions">
                    <button class="btn btn-lg btn-danger" type="submit">削除する</button>
                    <a class="btn btn-ghost" href="{% url 'countdown:event_list' %}">キャンセル</a>
                </div>
            </form>
        </div>

    </section>
</div>
{% endblock %}
