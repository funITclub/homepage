{% extends "console/base.html" %}

{% block title %}ログイン — fun IT club コンソール{% endblock %}

{% block contents %}
<div class="container">
    <section class="editor editor-narrow">

        <div class="section-head">
            <p class="section-label">// ログイン</p>
        </div>

        <div class="card">
            <p class="editor-empty editor-lead">コンソールを開くにはログインしてください。編集画面と同じアカウントです。</p>

            <form method="post">
                {% csrf_token %}

                {% if form.errors %}
                <ul class="form-errors">
                    <li>ユーザー名またはパスワードが違います。</li>
                </ul>
                {% endif %}

                {% for field in form %}
                <div class="form-row">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}

                <div class="form-actions">
                    <button class="btn btn-lg" type="submit">ログイン</button>
                </div>
            </form>
        </div>

    </section>
</div>
{% endblock %}
