{% comment %}ページの名前ごとの回数の表。pages に views.with_percent() の行を渡す。{% endcomment %}
{% if pages %}
<div class="editor-table-wrap">
    <table class="editor-table">
        <thead>
            <tr>
                <th>ページ</th>
                <th class="pv-num">回数</th>
                <th class="pv-bar-col"></th>
            </tr>
        </thead>
        <tbody>
            {% for page in pages %}
            <tr>
                <td>{{ page.name }}</td>
                <td class="editor-date pv-num">{{ page.n }}</td>
                <td class="pv-bar-col"><span class="pv-bar" style="width: {{ page.percent }}%"></span></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<p class="editor-empty">{{ empty }}</p>
{% endif %}
